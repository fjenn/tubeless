[package]
name = "signin-helper"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Tubeless's desktop sign-in: Google's own sign-in page in a system web view; prints the youtube.com cookies as JSON"
publish = false

# its own workspace: built on its own (cargo build --release), never part of a parent one
[workspace]

[lib]
name = "tubeless_webview"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "signin-helper"
path = "src/main.rs"

[dependencies]
wry = "=0.55.1"
tao = "=0.35.3"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
