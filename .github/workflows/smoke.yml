name: Smoke

# Runtime smoke tests: the packaged app is started and used on each platform, not only compiled.
#   desktop   Windows (MSI installed), Linux (.deb installed, Xvfb), macOS (Tubeless.app): built like
#             release.yml, then scripts/smoke/desktop.sh drives it with the QA driver (parity-cmd.txt) and
#             reads its E2E log: start → Home → search → open a video → playback → Shorts swipe → Settings → quit
#   android   debug APK on an API 34 x86_64 emulator: scripts/smoke/android.sh (adb, screencap, uiautomator,
#             a real swipe, logcat crash check)
# Playback blocked by YouTube's bot wall (GitHub's datacenter IPs) is reported as BLOCKED, not as a failure;
# every UI step must pass. Screenshots, event logs and app output: the smoke-<platform> artifacts.
# billed minutes: nightly and by hand only (see ci.yml)
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  linux:
    # 22.04 as release.yml (the AppImage's glibc floor); libmpv from the system as users install it
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages (build + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb imagemagick libgl1-mesa-dri fonts-noto-cjk
      - name: Sign-in helper
        run: |
          (cd tools/signin-helper && cargo build --release --locked)
          mkdir -p desktop/resources/linux
          cp tools/signin-helper/target/release/signin-helper desktop/resources/linux/
      - name: Build .deb and the AppImage
        run: |
          ./gradlew --no-daemon :desktop:packageReleaseDeb :desktop:createReleaseDistributable
          cp "$(find desktop/build/compose/binaries/main-release/deb -name '*.deb' | head -1)" tubeless.deb
          packaging/linux/fix-deb.sh tubeless.deb
          packaging/linux/make-appimage.sh desktop/build/compose/binaries/main-release/app/Tubeless Tubeless.AppImage
      - name: Install the .deb
        run: |
          # libmpv comes in as the package's dependency (fix-deb.sh), as on a user's machine
          sudo apt-get install -y ./tubeless.deb
          dpkg -l 'libmpv*' | grep ^ii
          dpkg -L tubeless | grep -E 'bin/|signin-helper' || true
          exe=$(dpkg -L tubeless | grep -E '/bin/Tubeless$' | head -1)
          test -x "$exe" && echo "TUBELESS_EXE=$exe" >> "$GITHUB_ENV"
          dpkg -L tubeless | grep -q 'resources/signin-helper$' || { echo "::error::signin-helper missing in the .deb"; exit 1; }
      - name: Smoke (.deb)
        run: xvfb-run -a -s "-screen 0 1440x960x24" scripts/smoke/desktop.sh "$TUBELESS_EXE" smoke/linux
      - name: Smoke (AppImage starts)
        if: always()
        run: |
          rm -rf ~/.config/Tubeless
          chmod +x Tubeless.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 SMOKE_ONLY_START=1 xvfb-run -a -s "-screen 0 1440x960x24" scripts/smoke/desktop.sh "$PWD/Tubeless.AppImage" smoke/linux-appimage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke/

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/windows/fetch-libmpv.ps1 -Arch x86_64 -VulkanArch x64 -Out desktop/resources/windows
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign-in helper
        shell: bash
        run: |
          (cd tools/signin-helper && cargo build --release --locked)
          cp tools/signin-helper/target/release/signin-helper.exe desktop/resources/windows/
      - name: Build the .msi
        shell: bash
        run: |
          ./gradlew --no-daemon :desktop:packageReleaseMsi
          cp "$(find desktop/build/compose/binaries/main-release/msi -name '*.msi' | head -1)" Tubeless.msi
      - name: Install the .msi
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList '/i', 'Tubeless.msi', '/qn', '/l*v', 'msi.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 40; throw "msiexec exit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Filter Tubeless.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Tubeless.exe not found after install" }
          "TUBELESS_EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem (Join-Path $exe.DirectoryName 'app\resources') | Format-Table Name, Length
      - name: Smoke (installed .msi)
        shell: bash
        run: scripts/smoke/desktop.sh "$TUBELESS_EXE" smoke/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke/

  mac:
    if: github.event_name == 'workflow_dispatch'  # the Mac is tested locally
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Put libmpv inside the app
        run: packaging/macos/bundle-libmpv.sh desktop/resources/macos
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign-in helper
        run: |
          (cd tools/signin-helper && cargo build --release --locked)
          cp tools/signin-helper/target/release/signin-helper tools/signin-helper/target/release/libtubeless_webview.dylib desktop/resources/macos/
      - name: Build the app
        run: ./gradlew --no-daemon :desktop:createReleaseDistributable
      - name: Smoke (Tubeless.app)
        run: |
          app=$(find desktop/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' | head -1)
          scripts/smoke/desktop.sh "$PWD/$app/Contents/MacOS/Tubeless" smoke/mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-mac
          path: smoke/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK
        run: |
          ./gradlew --no-daemon :android:assembleDebug
          cp "$(find android/build/outputs/apk/debug -name '*.apk' | head -1)" tubeless-debug.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/smoke/android.sh tubeless-debug.apk smoke/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android
          path: smoke/
