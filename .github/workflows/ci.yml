name: CI

# The merge gate that CI can answer (PLAN §3 "Merge gate"): every push and pull request.
#   lint      asset lint (no YouTube logos, icon paths or the YouTube font), actionlint, shellcheck
#   desktop   :desktop:compileKotlin on macOS, Windows and Linux; golden-JSON parser tests (Linux)
#   engine    :desktop:engineCheck on each OS. Informational only: GitHub's runners are datacenter
#             addresses that YouTube bot-walls, so a red here is not a code verdict. The real check is
#             scripts/stream-health-local.sh from a home IP and the nightly stream-health.yml (WARP).
#   android   :android:assembleDebug + unit tests (the runners have an Android SDK, so settings.gradle.kts includes it)
#   ios       :ios:compileKotlinIosSimulatorArm64, the simulator framework link, and xcodebuild of Tubeless.app
#             for the simulator (unsigned)
#   web       :web wasm release build + the Chrome/Firefox extension zips (extension/build.sh)
# :desktop:homeCheck needs the owner's cookies and never runs here.
# Pushes run only on main, and the macOS
# jobs (desktop mac + iOS) run nightly or by hand; Mac/iOS builds are checked locally on every merge.
on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Asset lint
        run: scripts/asset-lint.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/smoke/*.sh packaging/macos/*.sh

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        shell: bash
        run: ./gradlew --no-daemon :desktop:compileKotlin
      - name: Golden-JSON parser tests
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --init-script tests/golden/golden.init.gradle :desktop:goldenCheck
      - name: Engine check (informational, datacenter IP)
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          ./gradlew --no-daemon -q :desktop:engineCheck | tee engine.txt
          echo "### engineCheck on ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -E '^(FAIL|all good|[0-9]+ failed)' engine.txt >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK + unit tests
        run: ./gradlew --no-daemon :android:assembleDebug :android:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Apple Silicon runners (7 GB): Gradle and the Kotlin compiler share it
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin for the iOS simulator and link the framework
        run: |
          ./gradlew --no-daemon :ios:compileKotlinIosSimulatorArm64 :ios:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache
          mkdir -p ios/build/kit && cp -R ios/build/bin/iosSimulatorArm64/debugFramework/*.framework ios/build/kit/
      - name: xcodebuild Tubeless.app for the simulator
        run: |
          brew install xcodegen
          (cd ios/app && xcodegen generate)
          xcodebuild -project ios/app/Tubeless.xcodeproj -scheme Tubeless -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/xcode ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          test -x build/xcode/Build/Products/Debug-iphonesimulator/Tubeless.app/Tubeless

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # :web wasm release build + extension/dist/{chrome,firefox} (extension/build.sh)
      - name: Build :web and the extension
        run: GRADLE_ARGS=--no-daemon extension/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist/*.zip
          retention-days: 7
      # the website (site/dist) from the same release wasm, for checking a branch's site before it reaches Pages
      - name: Build the site
        run: node site/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7
