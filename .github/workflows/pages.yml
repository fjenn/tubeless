name: Website (GitHub Pages)

# The Tubeless website (site/: Instant mode, and the hand-over to the extension when it is installed),
# built from this tree and published to GitHub Pages. It runs only in the public repo
# (fjenn/tubeless → https://fjenn.github.io/tubeless/); the private repo has no Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'fjenn/tubeless'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the same release wasm as the extension (extension/build.sh), then site/build.mjs (plain files, no npm install)
      - name: Build the site
        run: |
          ./gradlew --no-daemon -q :web:compileProductionExecutableKotlinWasmJs
          ./gradlew --no-daemon -q :web:compileProductionExecutableKotlinWasmJsOptimize --rerun
          # the extension from the same wasm: its Chrome zip is served by the site (youtube.html's "Add Tubeless to Chrome")
          node extension/build.mjs
          # Firefox: the signed add-on of the newest release, when it has one (release.yml signs it unlisted on AMO)
          if gh release download -R "$GITHUB_REPOSITORY" --pattern 'Tubeless-*-firefox.xpi' --dir xpi 2>/dev/null; then
            FIREFOX_XPI="$(find xpi -name '*.xpi' | head -1)"; export FIREFOX_XPI
          fi
          node site/build.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
