name: Website redirect (GitHub Pages)

# The Tubeless website (site/: Instant mode, the install page, the bookmark's yt.js) moved to
# https://opena.tech/tubeless/web/ (scripts/publish-site-opena.sh builds it into the opena.tech repo). GitHub Pages
# (https://fjenn.github.io/tubeless/) only forwards there now: site/redirect/ (every page and 404 → the same path
# on the new site; yt.js loads the new yt.js, so old bookmarks keep working). Runs only in the public repo.
on:
  push:
    branches: [main]
    paths: [site/redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'fjenn/tubeless'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
