name: Stream health

# Every night: the shared engine runs each of its calls against live YouTube (:desktop:engineCheck:
# search, streams, dubs, captions, channels, comments, playlists, downloads). When YouTube changes
# something and a call breaks, an issue is opened (or the open one gets a comment), and when the
# player clients are what broke, :desktop:engineRepair proposes a new clients.json as a pull request.
#
# A RED RUN IS USUALLY NOT A CODE REGRESSION: it means YouTube moved.
# GitHub's runners are datacenter addresses that YouTube asks to "sign in to confirm you're not a
# bot", so the check goes out through Cloudflare WARP (TH_SOCKS) and takes a new WARP address when
# challenged. The home-IP half is scripts/stream-health-local.sh.
#
# NEVER BLOCKS A MERGE: no push or pull_request trigger, on purpose.
# ANONYMOUS ON PURPOSE: no cookies or account secrets, ever (signed-in checks are :desktop:homeCheck,
# run locally with the owner's cookies).
#
# Adapted from upstream TubeHaus's engine-check.yml (GPL-3.0).
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC
  workflow_dispatch:
    inputs:
      warp:
        description: "Go out through Cloudflare WARP"
        type: boolean
        default: true

# contents + pull-requests: the repair step pushes a branch with a new clients.json and opens a PR
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: stream-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew --no-daemon :desktop:classes

      - name: Cloudflare WARP
        if: github.event_name == 'schedule' || inputs.warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          scripts/warp-connect.sh
          echo "TH_SOCKS=127.0.0.1:40000" >> "$GITHUB_ENV"

      - name: Run every engine call
        id: run
        env:
          TH_REPORT: ${{ runner.temp }}/failed.txt
          TH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # a bot wall is about the WARP address, not the engine: take a new one (twice at most)
          for try in 1 2 3; do
            rm -f "$TH_REPORT"
            if ./gradlew --no-daemon -q :desktop:engineCheck | tee "$RUNNER_TEMP/out.txt"; then exit 0; fi
            if [ "$try" = 3 ] || [ -z "${TH_SOCKS:-}" ] || ! grep -q "not a bot" "$RUNNER_TEMP/out.txt" "$TH_REPORT" 2>/dev/null; then exit 1; fi
            echo "::notice::YouTube asked this WARP address to sign in; taking a new one (after try $try)"
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos registration delete || true
            scripts/warp-connect.sh
          done

      - name: Look for player clients that still work
        id: repair
        if: failure() && steps.run.outcome == 'failure'
        env:
          TH_REPAIR_REPORT: ${{ runner.temp }}/repair.md
          TH_REPAIR_STATUS: ${{ runner.temp }}/repair.txt
          TH_REPORT: ${{ runner.temp }}/failed-after.txt
          GH_TOKEN: ${{ github.token }}
          TH_GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          ./gradlew --no-daemon -q :desktop:engineRepair || true
          status=$(cat "$TH_REPAIR_STATUS" 2>/dev/null || echo none)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" = rewritten ] || exit 0
          if ./gradlew --no-daemon -q :desktop:engineCheck > "$RUNNER_TEMP/out-after.txt" 2>&1; then echo "recheck=pass" >> "$GITHUB_OUTPUT"; else echo "recheck=fail" >> "$GITHUB_OUTPUT"; fi
          branch="engine-repair-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add clients.json
          git commit -q -m "clients.json: the player clients that work today"
          git push -q origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # needs "Allow GitHub Actions to create pull requests" in the repository settings; without it
          # the issue links to the branch instead
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" --title "clients.json: the player clients that work today" --body-file "$TH_REPAIR_REPORT" 2>/dev/null || true)
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: failure() && steps.run.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          REPAIR: ${{ steps.repair.outputs.status }}
          REPAIR_BRANCH: ${{ steps.repair.outputs.branch }}
          REPAIR_PR: ${{ steps.repair.outputs.pr }}
          REPAIR_RECHECK: ${{ steps.repair.outputs.recheck }}
          BASE: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require("fs");
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, "utf8").trim() : "";
            const failed = read(process.env.RUNNER_TEMP + "/failed.txt");
            const report = read(process.env.RUNNER_TEMP + "/repair.md");
            const repo = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const run = `${repo}/actions/runs/${context.runId}`;
            let repair = "";
            if (process.env.REPAIR === "rewritten") {
              const where = process.env.REPAIR_PR || `${repo}/compare/${process.env.BASE}...${process.env.REPAIR_BRANCH}?expand=1`;
              repair = `\n\n**A repaired client list is ready:** ${where}\nWith it the whole check ${process.env.REPAIR_RECHECK === "pass" ? "passes again" : "still fails (see the run log), so more than the client list is broken"}.\n\n<details><summary>What the repair tool found</summary>\n\n${report}\n</details>`;
            } else if (process.env.REPAIR === "fine") {
              repair = "\n\nThe player clients in clients.json still work, so this is in the code: someone has to look.";
            } else if (process.env.REPAIR === "stuck") {
              repair = `\n\nThe repair tool couldn't help:\n\n${report}`;
            }
            const body = `The nightly stream-health check found calls that no longer work:\n\n\`\`\`\n${failed || "(the check itself didn't finish: see the run log)"}\n\`\`\`${repair}\n\n[Run log](${run})`;
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "stream-health" })).data;
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: "Stream health: YouTube calls failing", body, labels: ["stream-health"] });

      - name: Close the issue when all is well again
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "stream-health" })).data;
            for (const i of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: "Tonight's stream-health check passed again." });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
            }
