name: iOS simulator check

# Runs the app in an iPad simulator and keeps screenshots and the log, as a check that it starts and
# draws (first start, Home, a video, a stress loop). Long (about an hour of macOS minutes), so by hand
# or weekly; the per-push gate is ci.yml (:ios:compileKotlinIosSimulatorArm64) and the .ipa comes from
# release.yml. From upstream TubeHaus ios.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC

permissions:
  contents: read

env:
  # Apple Silicon runners (M1, 7 GB): Gradle and the Kotlin compiler share it
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin → TubelessKit.framework (simulator)
        run: |
          ./gradlew :ios:linkDebugFrameworkIosSimulatorArm64 --no-configuration-cache --stacktrace
          mkdir -p ios/build/kit && cp -R ios/build/bin/iosSimulatorArm64/debugFramework/*.framework ios/build/kit/
      - name: Build for the simulator
        run: |
          brew install xcodegen
          (cd ios/app && xcodegen generate)
          xcodebuild -project ios/app/Tubeless.xcodeproj -scheme Tubeless -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/xcode ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Run it on an iPad
        # stopped here if it hangs, so the screenshots taken so far still get uploaded
        timeout-minutes: 25
        run: |
          set -x
          app=build/xcode/Build/Products/Debug-iphonesimulator/Tubeless.app
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPad' in x['name']))")
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          mkdir -p shots
          # how busy the Mac is, every 20 s (a hang that starved the runner left no log at all)
          (while true; do date >> shots/top.txt; top -l 1 -o cpu -n 6 -stats pid,command,cpu,mem | tail -8 >> shots/top.txt; sleep 20; done) &
          # first start: the language question
          xcrun simctl launch "$udid" dev.tubeless.app; sleep 25
          xcrun simctl io "$udid" screenshot shots/1-first-start.png
          xcrun simctl terminate "$udid" dev.tubeless.app || true
          # past the first questions, in English
          data=$(xcrun simctl get_app_container "$udid" dev.tubeless.app data)
          mkdir -p "$data/Library/Application Support/tubeless"
          echo '{"lang":"en","welcomed":true}' > "$data/Library/Application Support/tubeless/settings.json"
          xcrun simctl launch "$udid" dev.tubeless.app; sleep 40
          xcrun simctl io "$udid" screenshot shots/2-home.png
          xcrun simctl terminate "$udid" dev.tubeless.app || true
          # straight to a video (its related list comes from engine.js)
          xcrun simctl launch "$udid" dev.tubeless.app -open jNQXAC9IVRw; sleep 45
          xcrun simctl io "$udid" screenshot shots/3-video.png
          xcrun simctl terminate "$udid" dev.tubeless.app || true
          # over and over: three videos, full screen on and off, twice (the app does it by itself with -stress)
          xcrun simctl terminate "$udid" dev.tubeless.app || true; sleep 2
          # 360p: this checks the picture moving between places, not how fast the simulator decodes
          echo '{"lang":"en","welcomed":true,"maxHeight":360}' > "$data/Library/Application Support/tubeless/settings.json"
          xcrun simctl launch --terminate-running-process "$udid" dev.tubeless.app -stress
          for i in $(seq -w 1 16); do sleep 8; xcrun simctl io "$udid" screenshot "shots/5-stress-$i.png" || echo "screenshot $i failed"; done
          xcrun simctl terminate "$udid" dev.tubeless.app || true
          xcrun simctl spawn "$udid" log show --last 8m --style compact --predicate 'process == "Tubeless"' > shots/app.log 2>&1 || true
          tail -60 shots/app.log
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -iname '*tubeless*' -exec cp {} shots/ \; -print | grep -q . || echo "no crash report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPad-simulator-check
          path: shots/
