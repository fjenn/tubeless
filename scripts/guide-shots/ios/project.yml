name: Guide
options: { bundleIdPrefix: tech.opena.guide, deploymentTarget: { iOS: "17.0" } }
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    info: { path: Host/Info.plist, properties: { UILaunchScreen: {} } }
    settings: { CODE_SIGNING_ALLOWED: NO, GENERATE_INFOPLIST_FILE: YES }
  UIT:
    type: bundle.ui-testing
    platform: iOS
    sources: [UIT]
    dependencies: [{ target: Host }]
    settings: { CODE_SIGNING_ALLOWED: NO, GENERATE_INFOPLIST_FILE: YES, TEST_TARGET_NAME: Host }
